    <style>
      .sim-card {
        background: #2c2c2c;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        border-left: 4px solid #b3ffe5;

        color: #b3ffe5;

        border-radius: 6px;

      }

        max-height: 0;
        overflow: hidden;

        border-radius: 6px !important;
        max-height: 400px;

        background: #1d1f21 !important;

    <main>
      <!-- RIMOSSO IL FADE-IN QUI PER EVITARE CHE L'OPACITÀ RESTI A ZERO -->
      <section class="recent-publications fade-in">
        <h2>Methodological Simulations</h2>
        <p style="color: #ccc; margin-bottom: 2rem">
          All R scripts and Monte Carlo simulations used in my methodological

    <!-- Librerie JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-r.min.js"></script>

    <script>
      const faders = document.querySelectorAll('.fade-in');

      const appearOptions = {
        threshold: 0,
        rootMargin: '0px 0px -50px 0px',
      };

      const appearOnScroll = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          } else {
            entry.target.classList.remove('visible');
          }
        });
      }, appearOptions);

      faders.forEach((fader) => appearOnScroll.observe(fader));
    </script>
    
    <!-- Script esterno con il fetch delle pubblicazioni -->
    <script src="script.js"></script>

    <!-- Script Hamburger Menu -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const mobileMenuBtn = document.getElementById('mobile-menu');
    const navMenu = document.getElementById('nav-menu');

    if (mobileMenuBtn && navMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        navMenu.classList.toggle('active');
      });
    }
  });
</script>

<!-- Script Principale -->
<script>
  document.getElementById('current-year').textContent =
    new Date().getFullYear();

  function toggleCode(id) {
    const el = document.getElementById(id);

    if (el.style.maxHeight) {
      el.style.maxHeight = null;
    } else {
      el.style.maxHeight = el.scrollHeight + 'px';
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const container =
      document.getElementById('simulations-container');

    const status =
      document.getElementById('sim-status');

    const repoBase =
      'https://raw.githubusercontent.com/lorentz31/simulations/main/';

    const simulationsList = [
      {
        title: 'Meta-Analytic SEM: TSSEM vs OSMASEM',
        file: repoBase + 'MASEM/Main_20260901.r',
      },
      {
        title: 'Clustering: LPA vs K-means',
        file: repoBase + 'LPA/SimulationPLA_20260901.r',
      },
      {
        title: 'Power: GLMM vs Meta-analysis',
        file:
          repoBase +
          'Metaanalysis/Simulation_GLMMvsMeta_20260902.R',
      },
      {
        title: 'Outliers & Spurious Interactions',
        file:
          repoBase +
          'Regressions/OutliersInteraction_20260902.R',
      },
    ];

    function getDescription(markdown) {
      return markdown
        .replace(/^# .*\r?\n+/, '')
        .trim();
    }

    const sectionDescription =
      document.querySelector('.recent-publications > p');

    try {
      const response =
        await fetch(repoBase + 'README.md');

      if (response.ok) {
        const markdown = await response.text();

        sectionDescription.textContent =
          getDescription(markdown);
      }
    } catch (error) {
      console.error(error);
    }

    status.style.display = 'none';

    for (let i = 0; i < simulationsList.length; i++) {
      const sim = simulationsList[i];
      const codeId = 'codeBlock_' + i;
      const descriptionId = 'description_' + i;

      const descriptionFile =
        sim.file.replace(/\.r$/i, '.md');

      let description = 'Description unavailable.';

      try {
        const response =
          await fetch(descriptionFile);

        if (response.ok) {
          const markdown = await response.text();
          description = getDescription(markdown);
        }
      } catch (error) {
        console.error(error);
      }

      const card = document.createElement('div');
      card.className = 'sim-card';

      card.innerHTML = `
        <h3 class="sim-title">${sim.title}</h3>

        <p
          class="sim-desc"
          id="${descriptionId}"
        ></p>

        <button
          class="toggle-code-btn"
          onclick="toggleCode('${codeId}')"
        >
          <i class="fas fa-code"></i>
          Show / Hide R Code
        </button>

        <div
          id="${codeId}"
          class="code-container"
        >
          <pre><code
            class="language-r"
            id="text_${codeId}"
          >Fetching code...</code></pre>
        </div>
      `;

      container.appendChild(card);

      document
        .getElementById(descriptionId)
        .textContent = description;

      try {
        const response = await fetch(sim.file);

        const codeElement =
          document.getElementById('text_' + codeId);

        if (response.ok) {
          const code = await response.text();
          codeElement.textContent = code;
          Prism.highlightElement(codeElement);
        } else {
          codeElement.textContent =
            'Error: Impossibile caricare ' + sim.file;
        }
      } catch (error) {
        document.getElementById(
          'text_' + codeId
        ).textContent = 'Fetch failed: ' + error;
      }
    }
  });
</script>
